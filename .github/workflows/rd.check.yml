name: check / react-doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "packages/catalog/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "packages/catalog/**"

# Each job asks for what it needs; nothing is granted workflow-wide.
permissions: {}

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    # Read the code, and post the summary comment on the pull request. No commit status is
    # published (`commit-status: false`) and nothing touches issues, so neither is granted.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Actions run from a full commit SHA, because a tag can be moved to different code. Update the
      # SHA and its comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          commit-status: false
          # The CLI the action downloads and runs is pinned too; `latest` would run whatever is
          # published at that moment.
          version: 0.9.23
