name: build / docker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/db/**"
      - "packages/reader/**"
      - "packages/tsconfig/**"
      - "packages/ui/**"
      - "packages/worker/**"
      - ".dockerignore"
      - ".bun-version"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/docker.build.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/db/**"
      - "packages/reader/**"
      - "packages/tsconfig/**"
      - "packages/ui/**"
      - "packages/worker/**"
      - ".dockerignore"
      - ".bun-version"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/docker.build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.14

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apps/api
            image: kyomi-api:ci
            dockerfile: apps/api/Dockerfile
            cache-scope: api
          - name: apps/web
            image: kyomi-web:ci
            dockerfile: apps/web/Dockerfile
            cache-scope: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
