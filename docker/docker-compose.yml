name: kyomi

services:
  postgres:
    image: postgres:18-alpine
    container_name: kyomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/<major>/ (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kyomi-network

  redis:
    image: redis:8-alpine
    container_name: kyomi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kyomi-network

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: kyomi-garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    ports:
      - "${GARAGE_S3_PORT}:3900"
      - "${GARAGE_RPC_PORT}:3901"
      - "${GARAGE_WEB_PORT}:3902"
    networks:
      - kyomi-network

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: kyomi-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kyomi-network

  api:
    image: oven/bun:1.3
    container_name: kyomi-api
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
      [
        "sh",
        "-lc",
        "bun install --frozen-lockfile --ignore-scripts && bun run start"
      ]
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      FEED_ADMIN_USER_IDS: ${FEED_ADMIN_USER_IDS}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX_FEEDS: ${MEILI_INDEX_FEEDS}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - kyomi-network

  worker:
    image: oven/bun:1.3
    container_name: kyomi-worker
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
      [
        "sh",
        "-lc",
        "bun install --frozen-lockfile --ignore-scripts && bun run worker"
      ]
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      FEED_ADMIN_USER_IDS: ${FEED_ADMIN_USER_IDS}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX_FEEDS: ${MEILI_INDEX_FEEDS}
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - kyomi-network

volumes:
  postgres_data:
    name: vols_rss_postgres_data
  redis_data:
    name: vols_rss_redis_data
  garage_data:
    name: vols_rss_garage_data
  garage_meta:
    name: vols_rss_garage_meta
  meili_data:
    name: vols_rss_meili_data

networks:
  kyomi-network:
    name: kyomi-network
    driver: bridge
