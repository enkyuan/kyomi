services:
  postgres:
    image: postgres:18-alpine
    container_name: cronos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cronos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cronos-network

  redis:
    image: redis:8-alpine
    container_name: cronos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cronos-network

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: cronos-garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_RPC_PORT:-3901}:3901"
      - "${GARAGE_WEB_PORT:-3902}:3902"
    networks:
      - cronos-network

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: cronos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cronos-meili-dev-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cronos-network

  api:
    image: oven/bun:1.3
    container_name: cronos-api
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
      [
        "sh",
        "-lc",
        "[ -d /app/node_modules ] || bun install --frozen-lockfile && exec bun run start"
      ]
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-cronos}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-a7324a983ce0ed18c033d38800b184b5308db076cca4f1fd47cd6dfc0ce78317}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FEED_ADMIN_USER_IDS: ${FEED_ADMIN_USER_IDS:-}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cronos-meili-dev-key}
      MEILI_INDEX_FEEDS: ${MEILI_INDEX_FEEDS:-feeds}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ..:/app
      - cronos_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - cronos-network

  worker:
    image: oven/bun:1.3
    container_name: cronos-worker
    restart: unless-stopped
    working_dir: /app/apps/api
    command:
      [
        "sh",
        "-lc",
        "[ -d /app/node_modules ] || bun install --frozen-lockfile && exec bun run worker"
      ]
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-cronos}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-a7324a983ce0ed18c033d38800b184b5308db076cca4f1fd47cd6dfc0ce78317}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FEED_ADMIN_USER_IDS: ${FEED_ADMIN_USER_IDS:-}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cronos-meili-dev-key}
      MEILI_INDEX_FEEDS: ${MEILI_INDEX_FEEDS:-feeds}
    volumes:
      - ..:/app
      - cronos_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - cronos-network

volumes:
  postgres_data:
  redis_data:
  garage_data:
  garage_meta:
  meili_data:
  cronos_node_modules:

networks:
  cronos-network:
    name: cronos-network
    driver: bridge
