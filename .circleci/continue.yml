# Continuation of .circleci/config.yml. `ci-summary` is the one required check, so it is
# always reported: the `ci` workflow runs when app code changed, `ci-light` runs
# otherwise. A job that has nothing to do in `ci-light` finishes in seconds on a
# small executor, so the service containers and large executors of the heavy
# jobs are never provisioned for a docs-only or catalog-only change.
#
# Local equivalents: docs/ci-cd.md.
version: 2.1

parameters:
  app:
    type: boolean
    default: false
  docker:
    type: boolean
    default: false
  catalog:
    type: boolean
    default: false

executors:
  bun:
    docker:
      - image: cimg/node:24
    resource_class: medium
  # Two shards of ~115 files each. The unsharded suite needed `large` (8 GB) because four
  # services plus `bun test --isolate` over ~230 files exceeded medium's 4 GB and the kernel
  # SIGKILLed bun or Meilisearch (exit 137). `medium+` (6 GB) per shard costs the same credits per
  # minute as one `large` but finishes in about half the time.
  bun-services:
    docker:
      - image: cimg/node:24
      - image: postgres:18-alpine
        environment:
          POSTGRES_DB: kyomi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
      - image: redis:8-alpine
      - image: getmeili/meilisearch:v1.15
        environment:
          MEILI_MASTER_KEY: vols-meili-dev-key
          MEILI_NO_ANALYTICS: "true"
    resource_class: medium+
  base:
    docker:
      - image: cimg/base:current
    resource_class: small

commands:
  only-if:
    description: Run `steps` when `condition` holds; otherwise finish immediately.
    parameters:
      condition:
        type: boolean
      steps:
        type: steps
    steps:
      - when:
          condition: << parameters.condition >>
          steps: << parameters.steps >>
      - unless:
          condition: << parameters.condition >>
          steps:
            - run:
                name: Nothing relevant changed
                command: echo "No changes in this job's paths; skipping."

  setup-bun:
    description: Install the pinned Bun, restore its package cache, install the workspace.
    parameters:
      prefetch:
        description: Warm the bunx tools (oxfmt, oxlint). Only jobs that run them need it.
        type: boolean
        default: true
    steps:
      - restore_cache:
          keys:
            - bun-v1-{{ arch }}-{{ checksum ".bun-version" }}-{{ checksum "bun.lock" }}
            - bun-v1-{{ arch }}-{{ checksum ".bun-version" }}-
      - run:
          name: Install Bun
          command: |
            want="$(cat .bun-version)"
            if [ "$("$HOME/.bun/bin/bun" --version 2>/dev/null)" != "$want" ]; then
              curl -fsSL https://bun.sh/install | bash -s "bun-v${want}"
            fi
            # The cache restores bun but not its bunx symlink.
            ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ arch }}-{{ checksum ".bun-version" }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun
      - when:
          condition: << parameters.prefetch >>
          steps:
            - run:
                # oxfmt/oxlint are invoked via `bunx` from every workspace package.
                # Installing them once here avoids turbo's parallel tasks racing to
                # install the same tool into bunx's shared temp cache (ENOENT).
                name: Prefetch bunx tools
                command: |
                  bunx oxfmt --version
                  bunx oxlint --version

  restore-turbo:
    description: Restore Turbo's content-hashed local cache (this branch's, else main's).
    parameters:
      scope:
        type: string
    steps:
      - restore_cache:
          keys:
            - turbo-<< parameters.scope >>-v1-{{ .Branch }}-
            - turbo-<< parameters.scope >>-v1-main-

  save-turbo:
    description: Save Turbo's cache from main only; branches reuse main's, so they upload nothing.
    parameters:
      scope:
        type: string
    steps:
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                key: turbo-<< parameters.scope >>-v1-main-{{ .Revision }}
                paths:
                  - .turbo

jobs:
  static-quality:
    executor: bun
    steps:
      # Unlike every other job this one always checks out and installs: an env file can be tracked
      # anywhere (docs, .agents, packages/catalog), so the path filter must not decide whether the
      # secret scan runs. It reads the dotenvx parser from the workspace install.
      - checkout
      - setup-bun
      - run:
          name: Env files hold no plaintext (checkout and commits new on this branch)
          command: |
            bun run check:env
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            bun run check:env --range origin/main..HEAD
      - only-if:
          condition: << pipeline.parameters.app >>
          steps:
            # Turbo's local cache is content-hashed: packages whose inputs did
            # not change replay their fmt/lint/typecheck result instead of rerunning.
            - restore-turbo:
                scope: static
            - run:
                name: Static quality (fmt, lint, boundaries, typecheck, drizzle drift)
                no_output_timeout: 10m
                command: timeout 20m bun run ci:static
            - save-turbo:
                scope: static

  web-tests:
    executor: bun
    steps:
      - checkout
      - setup-bun:
          prefetch: false
      - run:
          name: Web integration tests
          no_output_timeout: 10m
          command: timeout 20m bun run ci:test:web

  # Sharded across `parallelism` containers, balanced by recorded timings (file size until the
  # first run has uploaded some). Each container runs its own Postgres, Redis and Meilisearch.
  api-tests:
    executor: bun-services
    parallelism: 2
    steps:
      - checkout
      - setup-bun:
          prefetch: false
      - run:
          name: Wait for Postgres, Redis and Meilisearch
          command: |
            for port in 5432 6379 7700; do
              for _ in $(seq 60); do
                (echo > "/dev/tcp/127.0.0.1/$port") 2>/dev/null && break
                sleep 1
              done
            done
            for _ in $(seq 60); do
              curl -fsS http://127.0.0.1:7700/health && break
              sleep 1
            done
      - run:
          name: API integration tests (this container's shard)
          no_output_timeout: 10m
          command: |
            bun scripts/ci/prepare-env.ts
            shard="$(circleci tests glob 'tests/api/integration/**/*.test.ts' | circleci tests split --split-by=timings)"
            test -n "$shard" || { echo "No API test files in this shard."; exit 0; }
            echo "$shard" | wc -l | xargs echo "Files in this shard:"
            mkdir -p "$PWD/test-results/api"
            cd apps/api
            # Same invocation as `bun run test:api:integration`, narrowed to this shard's files.
            SKIP_ENV_VALIDATION=true timeout 25m \
              bunx --no-install dotenvx run -f ../../docker/.env -f .env -- \
              bun test --isolate \
              --reporter=junit --reporter-outfile="$OLDPWD/test-results/api/junit.xml" \
              $(echo "$shard" | sed 's|^|../../|')
      - store_test_results:
          path: test-results

  build:
    executor: bun
    steps:
      - checkout
      - setup-bun
      - restore-turbo:
          scope: build
      - run:
          name: Build workspaces
          no_output_timeout: 10m
          command: |
            nproc; free -m | head -2
            bun scripts/ci/prepare-env.ts
            export EXPO_PUBLIC_AUTH_ORIGIN=https://ci.kyomi.invalid SKIP_ENV_VALIDATION=true
            for w in web www mobile; do
              s=$(date +%s); timeout 15m bun run --cwd apps/$w build; echo "PROFILE $w exit=$? $(( $(date +%s)-s ))s"
            done
      - save-turbo:
          scope: build

  # Image smoke builds are the slowest job and mostly fail on Dockerfile,
  # .dockerignore or manifest changes, so a PR builds them only for those;
  # main builds them after any app change.
  docker-build:
    executor: base
    steps:
      - when:
          condition:
            or:
              - << pipeline.parameters.docker >>
              - equal: [main, << pipeline.git.branch >>]
          steps:
            - checkout
            - setup_remote_docker
            - run:
                name: Build API and Web images
                no_output_timeout: 15m
                command: |
                  bun_version="$(cat .bun-version)"
                  docker build --build-arg BUN_VERSION="$bun_version" -f apps/api/Dockerfile -t kyomi-api:ci .
                  docker build --build-arg BUN_VERSION="$bun_version" -f apps/web/Dockerfile -t kyomi-web:ci .
      - unless:
          condition:
            or:
              - << pipeline.parameters.docker >>
              - equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Nothing relevant changed
                command: echo "No Docker-relevant changes; skipping."

  catalog-typecheck:
    docker:
      - image: cimg/python:3.13-node
    resource_class: medium
    steps:
      - only-if:
          condition: << pipeline.parameters.catalog >>
          steps:
            - checkout
            - run:
                name: Install uv
                command: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            - restore_cache:
                keys:
                  - uv-catalog-v1-{{ checksum "packages/catalog/uv.lock" }}
            - setup-bun
            - run:
                name: Install catalog dependencies
                command: bun run --cwd packages/catalog setup
            - save_cache:
                key: uv-catalog-v1-{{ checksum "packages/catalog/uv.lock" }}
                paths:
                  - ~/.cache/uv
            - run:
                name: Typecheck catalog
                command: bun run --cwd packages/catalog typecheck

  ci-summary:
    executor: base
    steps:
      - run: echo "All required CI jobs passed."

workflows:
  # App code changed: the full gate.
  ci:
    when: << pipeline.parameters.app >>
    jobs:
      # Static checks are the cheapest and catch most failures, so the
      # expensive jobs wait for them instead of burning credits in parallel.
      - static-quality
      - web-tests:
          requires: [static-quality]
      - api-tests:
          requires: [static-quality]
      - build:
          requires: [static-quality]
      - docker-build:
          requires: [static-quality]
      - catalog-typecheck
      - ci-summary:
          requires:
            - static-quality
            - web-tests
            - api-tests
            - build
            - docker-build
            - catalog-typecheck

  # Nothing but docs, agent notes or the catalog changed: the secret scan, the catalog typecheck
  # when it is touched, and the same required check.
  ci-light:
    when:
      not: << pipeline.parameters.app >>
    jobs:
      - static-quality
      - catalog-typecheck
      - ci-summary:
          requires:
            - static-quality
            - catalog-typecheck
