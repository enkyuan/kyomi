# Setup pipeline: diff the change against main (or HEAD~1 on main itself) and
# continue with .circleci/continue.yml, switching on only the areas it touches.
# Requires "Enable dynamic config using setup workflows" in the project settings.
version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          name: changes
          base-revision: main
          config-path: .circleci/continue.yml
          # Docs, agent notes and scratch never reach a build or a test.
          exclude: |
            docs/.*
            .*\.md
            \.agents/.*
            \.pi/.*
            scratch/.*
            \.github/.*
          # One line per parameter: a parameter matched on two lines would be
          # sent twice in the continuation's parameters.
          mapping: |
            (?!packages/catalog/).* app true
            (apps/(api|web)/Dockerfile|\.dockerignore|\.bun-version|bun\.lock|package\.json|(apps|packages)/[^/]+/package\.json|turbo\.json|patches/.*) docker true
            (packages/catalog/.*|\.circleci/.*) catalog true
