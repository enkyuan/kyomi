[project]
name = "catalog-pipeline"
version = "0.1.0"
description = "The RSS dataset powering Cronos"
authors = [
    {name = "enkyuan",email = "yuan.enkng@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tqdm (>=4.67.1,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "lingua-language-detector (>=2.1.1,<3.0.0)",
    "playwright (>=1.56.0,<2.0.0)",
    "urllib3 (>=2.5.0,<3.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "zstandard (>=0.25.0,<0.26.0)",
    "duckdb (>=1.4.2,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "tranco (>=0.8.1,<0.9.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "google-genai (>=1.54.0,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "langcodes (>=3.5.1,<4.0.0)",
    "jl (>=0.0.3,<0.0.4)",
    "google-cloud-aiplatform (>=1.130.0,<2.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "dedupe (>=3.0.3,<4.0.0)",
    "extract-favicon (>=0.5.4,<0.6.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
