<div id="S1.p1" class="ltx_para">
<p id="S1.p1.1" class="ltx_p">Let <math id="S1.p1.1.m1.1" class="ltx_Math" alttext="x_{i}^{2}" display="inline"><semantics id="S1.p1.1.m1.1a"><msubsup id="S1.p1.1.m1.1.1" xref="S1.p1.1.m1.1.1.cmml"><mi id="S1.p1.1.m1.1.1.2.2">x</mi><mi id="S1.p1.1.m1.1.1.2.3">i</mi><mn id="S1.p1.1.m1.1.1.3">2</mn></msubsup><annotation encoding="application/x-tex" id="S1.p1.1.m1.1c">x_{i}^{2}</annotation></semantics></math> denote the squared residual of sample <math id="S1.p1.1.m2.1" class="ltx_Math" alttext="i" display="inline"><semantics><mi>i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>, following the setup in <cite class="ltx_cite ltx_citemacro_cite">[<a href="#bib.bib3" title="" class="ltx_ref">3</a>]</cite>.</p>
